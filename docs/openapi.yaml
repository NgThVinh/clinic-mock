openapi: 3.1.0
info:
  title: Clinic Platform API
  version: '1.1.0'
  summary: Public appointment-booking API plus voice-call lifecycle API.
  description: |
    Authoritative human-readable spec: ../docs/APIs.md.
    This file is the machine-readable companion and is the source of truth for client tooling.
  contact:
    email: api-support@clinic.example
  license:
    name: Proprietary
servers:
  - url: https://api.clinic.example/v1
    description: Production
  - url: https://sandbox.api.clinic.example/v1
    description: Sandbox
security:
  - bearerAuth: []
tags:
  - name: Discovery
    description: Patient and slot lookup.
  - name: Appointments
    description: Booking, reading, and lifecycle management.
  - name: Calls
    description: Voice-agent call lifecycle (start, identity state, escalate, attempts, end).
  - name: Admin
    description: Sandbox/admin harness endpoints. Requires harness:admin scope.

paths:
  /patients:
    get:
      tags: [Discovery]
      operationId: findPatients
      summary: Find patients by phone.
      security:
        - bearerAuth: [patients:read]
      parameters:
        - in: query
          name: phone
          required: true
          schema:
            type: string
            pattern: '^\+[1-9]\d{7,14}$'
      responses:
        '200':
          description: Paginated list of patients.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /slots:
    get:
      tags: [Discovery]
      operationId: listOpenSlots
      summary: List open, bookable slots.
      security:
        - bearerAuth: [slots:read]
      parameters:
        - { in: query, name: clinic_id, required: true, schema: { type: string } }
        - { in: query, name: from, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: to, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated list of slots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlotPage' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /appointments:
    post:
      tags: [Appointments]
      operationId: createAppointment
      summary: Book an appointment.
      security:
        - bearerAuth: [appointments:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentCreate' }
      responses:
        '201':
          description: Appointment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/IdempotencyConflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Appointments]
      operationId: listAppointmentsByDay
      summary: Day schedule for a clinic.
      security:
        - bearerAuth: [appointments:read]
      parameters:
        - { in: query, name: date, required: true, schema: { type: string, format: date } }
        - { in: query, name: clinic_id, required: true, schema: { type: string } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated list of appointments ordered by start time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentPage' }

  /appointments/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Appointments]
      operationId: getAppointment
      summary: Read a single appointment.
      security:
        - bearerAuth: [appointments:read]
      responses:
        '200':
          description: The appointment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '404': { $ref: '#/components/responses/NotFound' }

  /appointments/{id}/confirm:
    post:
      tags: [Appointments]
      operationId: confirmAppointment
      security:
        - bearerAuth: [appointments:write]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated appointment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appointments/{id}/cancel:
    post:
      tags: [Appointments]
      operationId: cancelAppointment
      security:
        - bearerAuth: [appointments:write]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200':
          description: Updated appointment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appointments/{id}/transfer:
    post:
      tags: [Appointments]
      operationId: transferAppointment
      security:
        - bearerAuth: [appointments:write]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '200':
          description: Updated appointment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appointments/{id}/reschedule:
    post:
      tags: [Appointments]
      operationId: rescheduleAppointment
      security:
        - bearerAuth: [appointments:write]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleRequest' }
      responses:
        '200':
          description: Updated appointment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }

  # --- Calls API ---

  /calls:
    post:
      tags: [Calls]
      operationId: startCall
      summary: Start a new inbound call.
      security:
        - bearerAuth: [calls:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallCreate' }
      responses:
        '201':
          description: Call created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /calls/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Calls]
      operationId: getCall
      summary: Read call state.
      security:
        - bearerAuth: [calls:read]
      responses:
        '200':
          description: Call state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Calls]
      operationId: patchCall
      summary: Update mid-call state (verified, patient_id, status).
      security:
        - bearerAuth: [calls:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallPatch' }
      responses:
        '200':
          description: Updated call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /calls/{id}/escalate:
    post:
      tags: [Calls]
      operationId: escalateCall
      summary: Transfer the live call to staff.
      description: |
        The transfer-to-staff scenario: invoked when the agent goes off-script,
        after two consecutive failed understandings, on patient request, etc.
      security:
        - bearerAuth: [calls:write]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EscalateRequest' }
      responses:
        '200':
          description: Call escalated. status=ESCALATED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
        '400':
          description: Validation failed or invalid escalation target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /calls/{id}/attempts:
    post:
      tags: [Calls]
      operationId: logCallAttempt
      summary: Log a no-answer event (ringout, voicemail, or silent turn).
      security:
        - bearerAuth: [calls:write]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptRequest' }
      responses:
        '201':
          description: Attempt recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallAttempt' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /calls/{id}/end:
    post:
      tags: [Calls]
      operationId: endCall
      summary: End the call.
      security:
        - bearerAuth: [calls:write]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndCallRequest' }
      responses:
        '200':
          description: Call ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # --- Harness (admin) ---

  /_harness/state:
    get:
      tags: [Admin]
      operationId: harnessGetState
      summary: Full snapshot (patients, slots, appointments, calls, escalations).
      security:
        - bearerAuth: [harness:admin]
      responses:
        '200':
          description: Full state snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HarnessState' }

  /_harness/patients:
    get:
      tags: [Admin]
      operationId: harnessListPatients
      security:
        - bearerAuth: [harness:admin]
      responses:
        '200':
          description: Filtered list of seeded patients.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatientPage' }

  /_harness/slots:
    get:
      tags: [Admin]
      operationId: harnessListSlots
      security:
        - bearerAuth: [harness:admin]
      parameters:
        - { in: query, name: clinic_id, schema: { type: string } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Filtered list of slots.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlotPage' }

  /_harness/appointments:
    get:
      tags: [Admin]
      operationId: harnessListAppointments
      security:
        - bearerAuth: [harness:admin]
      parameters:
        - { in: query, name: clinic_id, schema: { type: string } }
        - { in: query, name: date, schema: { type: string, format: date } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/AppointmentStatus' } }
      responses:
        '200':
          description: Filtered list of appointments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentPage' }

  /_harness/calls:
    get:
      tags: [Admin]
      operationId: harnessListCalls
      security:
        - bearerAuth: [harness:admin]
      parameters:
        - { in: query, name: status, schema: { $ref: '#/components/schemas/CallStatus' } }
        - { in: query, name: tenant_id, schema: { type: string } }
      responses:
        '200':
          description: Filtered list of calls.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Call' }

  /_harness/calls/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Admin]
      operationId: harnessGetCall
      security:
        - bearerAuth: [harness:admin]
      responses:
        '200':
          description: Single call with attempts, escalations, linked appointments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }

  /_harness/escalations:
    get:
      tags: [Admin]
      operationId: harnessListEscalations
      security:
        - bearerAuth: [harness:admin]
      responses:
        '200':
          description: All escalations across all calls.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Escalation' }

  /_harness/snapshot:
    get:
      tags: [Admin]
      operationId: harnessCaptureSnapshot
      security:
        - bearerAuth: [harness:admin]
      responses:
        '200':
          description: Captured snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot_id: { type: string }
                  captured_at: { type: string, format: date-time }

  /_harness/snapshot/{id}/restore:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [Admin]
      operationId: harnessRestoreSnapshot
      security:
        - bearerAuth: [harness:admin]
      responses:
        '200': { description: Restored. }

  /_harness/seed:
    post:
      tags: [Admin]
      operationId: harnessSeed
      summary: Seed the database with mock data.
      security:
        - bearerAuth: [harness:admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Seeded. }

  /_harness/reset:
    post:
      tags: [Admin]
      operationId: harnessReset
      summary: Flush the database back to zero.
      security:
        - bearerAuth: [harness:admin]
      responses:
        '200': { description: Reset. }

  /_harness/time-travel:
    post:
      tags: [Admin]
      operationId: harnessTimeTravel
      summary: Advance the system clock (test only).
      security:
        - bearerAuth: [harness:admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, format: date-time }
      responses:
        '200': { description: Clock advanced. }

webhooks:
  appointmentCreated:
    post:
      summary: appointment.created
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEventAppointment' }
      responses:
        '200': { description: Acknowledged. }
  appointmentConfirmed:
    post:
      summary: appointment.confirmed
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEventAppointment' }
      responses:
        '200': { description: Acknowledged. }
  appointmentCancelled:
    post:
      summary: appointment.cancelled
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEventAppointment' }
      responses:
        '200': { description: Acknowledged. }
  appointmentTransferred:
    post:
      summary: appointment.transferred
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEventAppointment' }
      responses:
        '200': { description: Acknowledged. }
  appointmentRescheduled:
    post:
      summary: appointment.rescheduled
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEventAppointment' }
      responses:
        '200': { description: Acknowledged. }
  callStarted:
    post:
      summary: call.started
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEventCall' }
      responses:
        '200': { description: Acknowledged. }
  callEscalated:
    post:
      summary: call.escalated
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEventCall' }
      responses:
        '200': { description: Acknowledged. }
  callNoAnswer:
    post:
      summary: call.no_answer
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEventCall' }
      responses:
        '200': { description: Acknowledged. }
  callEnded:
    post:
      summary: call.ended
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEventCall' }
      responses:
        '200': { description: Acknowledged. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: API key issued per tenant; prefix with `Bearer `.

  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 255 }
      description: Stable per-request key for replay protection. See APIs.md §8.

  responses:
    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid bearer token.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Token lacks required scope.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State conflict (slot taken, invalid state transition, or call already ended).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdempotencyConflict:
      description: Idempotency-Key reused with a different payload.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Patient:
      type: object
      required: [id, first_name, last_name, phone, dob]
      properties:
        id: { type: string, pattern: '^[a-z]+_[A-Za-z0-9]+$', example: 'p_12345' }
        first_name: { type: string, example: 'Jane' }
        last_name: { type: string, example: 'Doe' }
        phone: { type: string, pattern: '^\+[1-9]\d{7,14}$', example: '+15551234567' }
        dob: { type: string, format: date, example: '1985-04-12' }

    Slot:
      type: object
      required: [slot_id, clinic_id, start_time, end_time, provider_id]
      properties:
        slot_id: { type: string }
        clinic_id: { type: string }
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        provider_id: { type: string }

    SlotRef:
      type: object
      required: [start_time, end_time, clinic_id]
      properties:
        start_time: { type: string, format: date-time }
        end_time: { type: string, format: date-time }
        clinic_id: { type: string }

    PatientRef:
      type: object
      required: [id, name, phone]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }

    AppointmentStatus:
      type: string
      enum: [PENDING, BOOKED, CONFIRMED, CANCELLED, TRANSFERRED, RESCHEDULED, COMPLETED, NO_SHOW]

    Appointment:
      type: object
      required: [id, status, slot, patient]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        slot: { $ref: '#/components/schemas/SlotRef' }
        patient: { $ref: '#/components/schemas/PatientRef' }

    AppointmentCreate:
      type: object
      required: [patient_id, slot_id]
      properties:
        patient_id: { type: string }
        slot_id: { type: string }
        notes: { type: string, maxLength: 500 }

    CancelReason:
      type: string
      enum: [PATIENT_NO_SHOW, PROVIDER_REQUEST, CLINIC_REBOOK, OTHER]

    TransferReason:
      type: string
      enum: [EQUIPMENT_FAILURE, PROVIDER_UNAVAILABLE, PATIENT_REQUEST, OTHER]

    CancelRequest:
      type: object
      required: [reason_code]
      properties:
        reason_code: { $ref: '#/components/schemas/CancelReason' }
        notes: { type: string, maxLength: 500 }

    TransferRequest:
      type: object
      required: [target_clinic_id, reason_code]
      properties:
        target_clinic_id: { type: string }
        reason_code: { $ref: '#/components/schemas/TransferReason' }

    RescheduleRequest:
      type: object
      required: [new_slot_id]
      properties:
        new_slot_id: { type: string }

    CallStatus:
      type: string
      enum:
        - RINGING
        - IN_PROGRESS
        - ESCALATED
        - ENDED_NO_ANSWER
        - ENDED_VOICEMAIL
        - ENDED_COMPLETED
        - ENDED_FAILED

    AttemptKind:
      type: string
      enum: [RINGOUT, VOICEMAIL, SILENT_TURN]

    EscalationReason:
      type: string
      enum: [TWO_FAILED_UNDERSTANDINGS, OFF_SCRIPT, PATIENT_REQUEST, OTHER]

    EndOutcome:
      type: string
      enum: [COMPLETED, NO_ANSWER, VOICEMAIL, FAILED]

    CallCreate:
      type: object
      required: [from_number, to_number]
      properties:
        from_number: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        to_number: { type: string, pattern: '^\+[1-9]\d{7,14}$' }

    CallPatch:
      type: object
      properties:
        verified: { type: boolean }
        patient_id: { type: string }
        status:
          oneOf:
            - { $ref: '#/components/schemas/CallStatus' }
            - type: 'null'

    CallAttempt:
      type: object
      required: [kind, at]
      properties:
        kind: { $ref: '#/components/schemas/AttemptKind' }
        at: { type: string, format: date-time }
        detail: { type: string, nullable: true, maxLength: 500 }

    Escalation:
      type: object
      required: [reason, at]
      properties:
        staff_id: { type: string, nullable: true }
        queue: { type: string, nullable: true }
        reason: { $ref: '#/components/schemas/EscalationReason' }
        at: { type: string, format: date-time }

    EscalateRequest:
      type: object
      required: [reason]
      properties:
        staff_id: { type: string }
        queue: { type: string }
        reason: { $ref: '#/components/schemas/EscalationReason' }

    AttemptRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/AttemptKind' }
        detail: { type: string, maxLength: 500 }

    EndCallRequest:
      type: object
      required: [outcome]
      properties:
        outcome: { $ref: '#/components/schemas/EndOutcome' }
        reason: { type: string, maxLength: 500 }

    Call:
      type: object
      required:
        - id
        - from_number
        - to_number
        - started_at
        - status
        - verified
        - attempts
        - escalations
        - linked_appointment_ids
      properties:
        id: { type: string, example: 'call_01HZ...' }
        tenant_id: { type: string, example: 'tenant_123' }
        from_number: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        to_number: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/CallStatus' }
        patient_id: { type: string, nullable: true }
        verified: { type: boolean }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/CallAttempt' }
        escalations:
          type: array
          items: { $ref: '#/components/schemas/Escalation' }
        linked_appointment_ids:
          type: array
          items: { type: string }

    HarnessState:
      type: object
      properties:
        patients:
          type: array
          items: { $ref: '#/components/schemas/Patient' }
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
        appointments:
          type: array
          items: { $ref: '#/components/schemas/Appointment' }
        calls:
          type: array
          items: { $ref: '#/components/schemas/Call' }
        escalations:
          type: array
          items: { $ref: '#/components/schemas/Escalation' }

    Page:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: {}
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }

    PatientPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Patient' }

    SlotPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Slot' }

    AppointmentPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Appointment' }

    ErrorDetail:
      type: object
      properties:
        field: { type: string }
        issue: { type: string }

    ErrorBody:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: |
            Machine-readable error code. Branch on this; do not parse `message`.
            Catalog: APIs.md §7.2. Possible values:
            VALIDATION_ERROR, INVALID_ESCALATION_TARGET, UNAUTHORIZED, FORBIDDEN,
            NOT_FOUND, UNSUPPORTED_VERSION, SLOT_TAKEN, RESCHEDULE_SLOT_TAKEN,
            INVALID_STATE_TRANSITION, CALL_ALREADY_ENDED, IDEMPOTENCY_CONFLICT,
            RATE_LIMITED, INTERNAL_ERROR, SERVICE_UNAVAILABLE.
        message: { type: string }
        request_id: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }

    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }

    WebhookMeta:
      type: object
      required: [name, id, occurred_at, tenant_id]
      properties:
        name: { type: string }
        id: { type: string }
        occurred_at: { type: string, format: date-time }
        tenant_id: { type: string }

    WebhookEventAppointment:
      type: object
      required: [event, appointment]
      properties:
        event: { $ref: '#/components/schemas/WebhookMeta' }
        appointment: { $ref: '#/components/schemas/Appointment' }

    WebhookEventCall:
      type: object
      required: [event, call]
      properties:
        event: { $ref: '#/components/schemas/WebhookMeta' }
        call: { $ref: '#/components/schemas/Call' }
